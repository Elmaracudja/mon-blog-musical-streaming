<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pré-écoute + Pub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      background:linear-gradient(135deg,#0f0f23 0%,#1a1a3e 100%);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .player{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      border-radius:24px;
      padding:35px;
      max-width:420px;width:100%;
      text-align:center;
      box-shadow:0 25px 50px rgba(0,0,0,0.5);
      border:1px solid rgba(255,255,255,0.1);
    }
    h1{color:#1db954;margin-bottom:12px;font-size:1.6em;font-weight:700}
    .track{color:#e0e0e0;font-size:1.1em;margin-bottom:18px}
    audio{width:100%;outline:none;margin:18px 0}
    audio::-webkit-media-controls-panel{background:rgba(29,185,84,0.9);border-radius:16px}
    .info{color:#cfcfcf;font-size:.9em;line-height:1.4;margin:10px 0 16px}
    .btn{
      background:linear-gradient(45deg,#4facfe,#00f2fe);
      color:white;border:0;
      padding:14px 22px;
      border-radius:50px;
      font-weight:700;font-size:1em;
      cursor:pointer;
      display:inline-block;
      box-shadow:0 12px 30px rgba(79,172,254,0.25);
      transition:transform .2s;
    }
    .btn:hover{transform:translateY(-2px)}
    .small{opacity:.9;font-size:.8em;margin-top:12px;color:#b9b9b9}
  </style>
</head>
<body>
  <div class="player">
    <h1>Pré‑écoute gratuite</h1>
    <div class="track">Keep You Up — Version 2</div>

    <audio id="audioPlayer"
           preload="metadata"
           controls
           controlsList="nodownload noremoteplayback nofullscreen"
           style="filter:brightness(1.1);">
      <source src="https://raw.githubusercontent.com/Elmaracudja/mon-blog-musical-streaming/main/audio/Keep%20You%20Up%20-%20Version%202.mp3" type="audio/mpeg">
      Navigateur incompatible.
    </audio>

    <div class="info">
      Écoute gratuite : 45 secondes.<br>
      Pour écouter entièrement : regardez une publicité.
    </div>

    <button class="btn" id="watchAdBtn" type="button">Regarder une publicité</button>
    <div class="small">Astuce : le bouton lance ici une “simulation pub” (à remplacer par ton réseau pub).</div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const watchAdBtn = document.getElementById('watchAdBtn');

    const PREVIEW_LIMIT = 45; // secondes
    let unlocked = false;

    // Optionnel (léger) : éviter menu contextuel
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Limite preview via timeupdate
    audio.addEventListener('timeupdate', () => {
      if (!unlocked && audio.currentTime > PREVIEW_LIMIT) {
        audio.pause();
        audio.currentTime = 0;
      }
    });

    // Quand la pub est "vue" => déverrouiller
    watchAdBtn.addEventListener('click', async () => {
      // TODO: remplacer par ton vrai flow pub (ex: callback "rewarded" => unlocked=true)
      watchAdBtn.disabled = true;
      watchAdBtn.textContent = "Publicité en cours…";

      await new Promise(r => setTimeout(r, 3000)); // simulation 3s

      unlocked = true;
      watchAdBtn.textContent = "Accès débloqué — Lecture complète";
      audio.play().catch(() => {});
    });
  </script>
</body>
</html>
